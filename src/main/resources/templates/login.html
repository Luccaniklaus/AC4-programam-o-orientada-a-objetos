<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Brinquedos Esportivos Kids</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="login-box">
    <h2>Entrar</h2>

    <div th:if="${param.error}" class="alerta erro">Usuário ou senha inválidos.</div>
    <div th:if="${param.logout}" class="alerta ok">Você saiu com sucesso.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>

        <p><button type="submit" class="botao">Entrar</button>
           <a class="botao secundario" th:href="@{/}">Voltar</a></p>
    </form>

    <p class="dica">Perfis de teste (somente para demonstração):<br>
        <b>user</b> / user123 &rarr; consulta<br>
        <b>admin</b> / admin123 &rarr; cadastro, edição e exclusão</p>
</div>
</body>
</html>
