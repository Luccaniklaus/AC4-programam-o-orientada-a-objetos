spring.application.name=brinquedos-esportivos
server.port=8080

# Banco H2 em memória (os dados são recriados a cada execução)
spring.datasource.url=jdbc:h2:mem:brinquedosdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: cria a tabela TDS_TB_BRINQUEDOS automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
